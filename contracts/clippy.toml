# clippy lint configuration for the Soroban workspace.
# Enforced by `cargo clippy --workspace --all-targets -- -D warnings` in CI.
#
# NOTE: Clippy's configuration file only accepts *settings* (thresholds, msrv,
# etc.). Lint LEVELS (deny/warn/allow) are NOT valid keys here — declaring them
# causes `cargo clippy` to abort with "unknown field `deny`" on every run.
# Levels are set where Clippy actually reads them:
#   * warn-by-default lints  -> elevated to errors by `-D warnings` in CI
#   * crate-level overrides  -> `#![allow(...)]` in each contract's lib.rs
#                              (e.g. `clippy::doc_markdown`, `non_snake_case`
#                              for invariant tests named after doc IDs)
#
# Notes for Soroban authors:
#   * Soroban contract entry points intentionally panic on invalid state
#     (e.g. "already initialized", "admin not set"); the host surfaces these
#     as transaction failures.
#   * Financial math uses checked_* explicitly; use it for new arithmetic.
msrv = "1.91"

# On-chain entry points (and their generated contractclient companions)
# legitimately take `env` + up to 7 more args (e.g. wrapped_asset.initialize,
# lending_controller.wrap). The threshold is an actual clippy.toml setting —
# unlike lint levels, which must live in the CLI flags or #[allow] attributes.
too-many-arguments-threshold = 8
