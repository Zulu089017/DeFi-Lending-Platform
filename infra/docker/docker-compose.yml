version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spg
      POSTGRES_PASSWORD: spg
      POSTGRES_DB: spg
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spg"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bridge:
    build: ../services/payment
    env_file: ../services/payment/.env
    environment:
      DATABASE_URL: postgresql://spg:spg@postgres:54../services/payment
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  relayer:
    build: ../services/cron
    env_file: ../services/cron/.env
    environment:
      DATABASE_URL: postgresql://spg:spg@postgres:54../services/cron
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  indexer:
    build: ../services/indexer
    env_file: ../services/indexer/.env
    environment:
      DATABASE_URL: postgresql://spg:spg@postgres:5432/spg
    ports: ["4200:4200"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  api:
    build: ../apps/api
    env_file: ../apps/api/.env
    environment:
      DATABASE_URL: postgresql://spg:spg@postgres:5432/spg
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build: ../apps/web
    env_file: ../apps/web/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
