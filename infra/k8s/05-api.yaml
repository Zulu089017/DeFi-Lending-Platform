apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: openlend }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: openlend/api:latest
          # SECRETS: provision an `api-env` Secret out-of-band (see
          # api/.env.example) containing DATABASE_URL, STELLAR_RPC,
          # STELLAR_NETWORK_PASSPHRASE, STELLAR_CONTROLLER, PORT, HOST,
          # LOG_LEVEL. NOTE: CORS_ORIGINS must be a comma-separated list of
          # allowed origins (e.g. https://openlend.xyz), NEVER "*", in
          # production.
          envFrom: [{ secretRef: { name: api-env } }]
          ports: [{ containerPort: 4000 }]
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: openlend }
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 4000 }]
