# Relayer Deployment.
#
# SECRETS: this file must NOT contain credentials. The `relayer-env` Secret is
# referenced below via `envFrom` and must be provisioned out-of-band BEFORE
# applying this manifest. Required keys (see relayer/.env.example):
#
#   DATABASE_URL,
#   STELLAR_RPC, STELLAR_NETWORK_PASSPHRASE, STELLAR_RELAYER_SECRET,
#   ETHEREUM_RPC, ETHEREUM_RELAYER_PK,
#   POLYGON_RPC, POLYGON_RELAYER_PK,
#   POLL_INTERVAL_MS, MAX_RETRIES, LOG_LEVEL
#
# Provision with:
#   kubectl create secret generic relayer-env --namespace spg --from-env-file=relayer/.env
apiVersion: apps/v1
kind: Deployment
metadata: { name: relayer, namespace: spg }
spec:
  replicas: 1
  selector: { matchLabels: { app: relayer } }
  template:
    metadata: { labels: { app: relayer } }
    spec:
      containers:
        - name: relayer
          image: spg/relayer:latest
          envFrom: [{ secretRef: { name: relayer-env } }]
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          # The relayer is a poller with no HTTP surface; k8s restarts it if
          # the process exits (restartPolicy: Always), so no probe is required
          # beyond the container exit status. Add a /health endpoint (as the
          # bridge has) before relying on liveness/readiness probes here.
