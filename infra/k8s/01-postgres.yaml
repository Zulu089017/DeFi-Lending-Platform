# PostgreSQL StatefulSet.
#
# SECRETS: this file must NOT contain credentials. The `postgres-credentials`
# Secret is referenced below via `envFrom` and must be provisioned out-of-band
# BEFORE applying this manifest, e.g.:
#
#   kubectl create secret generic postgres-credentials \
#     --namespace openlend \
#     --from-literal=POSTGRES_USER=openlend \
#     --from-literal=POSTGRES_PASSWORD='<strong-password>' \
#     --from-literal=POSTGRES_DB=openlend
#
# In production use Sealed Secrets (bitnami-labs/sealed-secrets) or an
# external secrets manager (External Secrets Operator, Vault) so the plaintext
# value never touches the repository or the cluster's etcd in cleartext.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: openlend
spec:
  ports: [{ port: 5432, targetPort: 5432 }]
  selector: { app: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: openlend
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          envFrom: [{ secretRef: { name: postgres-credentials } }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "4Gi" }
          # Use the POSTGRES_USER from the provisioned secret rather than
          # hardcoding a user that may not match the external credentials.
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER"']
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER"']
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 50Gi } }
