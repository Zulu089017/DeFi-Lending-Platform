[workspace]
resolver = "2"
members = [
    "contracts/wrapped_asset",
    "contracts/oracle",
    "contracts/collateral_vault",
    "contracts/lending_pool",
    "contracts/liquidation",
    "contracts/lending_controller",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/stellar-payment-gateway/stellar-payment-gateway-sdk-main/stellar-contracts"

[workspace.dependencies]
soroban-sdk = "27.0.4"

# NOTE: soroban-token-sdk / stellar-asset-sdk are intentionally NOT declared.
# They were previously pinned at 21.0.0 but are not used by any contract in
# this workspace (verified: zero `soroban_token_sdk`/`stellar_asset_sdk`
# references), and their transitive `ed25519-dalek`/`rand_core` constraints
# were a source of the CI dependency-resolution failures documented in
# BUILD_ENV_NOTES.md. Re-add them only when a contract actually needs them.

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = "symbols"
lto = true
