name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Node 22 LTS: the api tests pull in undici 8 (via testcontainers), which
  # requires Node >= 22.5 (webidl.util.markAsUncloneable).
  NODE_VERSION: 22

jobs:
  # ─── Lint all non-code files ───
  lint-configs:
    name: Lint config files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npx prettier --check "**/*.{json,md,yml,yaml}" "!**/node_modules/**" "!**/dist/**" "!**/target/**"

  # ─── Soroban contracts ───
  stellar-contracts:
    name: Soroban contracts
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./stellar-contracts } }
    steps:
      - uses: actions/checkout@v4
      # soroban-sdk 27 has MSRV 1.91 and its build.rs rejects the
      # `wasm32-unknown-unknown` target on Rust 1.82+ (reference-types /
      # multi-value features), requiring `wasm32v1-none` instead.
      # See `stellar-contracts/BUILD_ENV_NOTES.md`. Pinned to the MSRV for
      # deterministic builds (matches clippy.toml msrv).
      - uses: dtolnay/rust-toolchain@1.91.0
        with: { targets: wasm32v1-none, components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "./stellar-contracts" }
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked --target wasm32v1-none --release
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # ─── EVM contracts (standalone npm package, not in the pnpm workspace) ───
  evm-contracts:
    name: EVM contracts
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./evm-contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "${{ env.NODE_VERSION }}",
            cache: npm,
            cache-dependency-path: evm-contracts/package-lock.json,
          }
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test
      # slither-action v0.4.0 runs from the repo root (GITHUB_WORKSPACE),
      # not the job's `working-directory`, and its only path input is
      # `target`. The previous `contract_dir` / snake_case inputs are not
      # accepted by this action version. `target` points at the Hardhat
      # project so `@openzeppelin` resolves via evm-contracts/node_modules.
      - name: Slither static analysis
        uses: crytic/slither-action@v0.4.0
        with:
          target: evm-contracts
          solc-version: 0.8.24
          slither-args: --filter-paths "node_modules|openzeppelin" --fail-low

  # ─── TypeScript services (pnpm workspace) ───
  ts-services:
    name: TS services (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [bridge, relayer, indexer, api, sdk]
        include:
          # bridge and relayer import @prisma/client (bridge/src/store/db.ts,
          # relayer/src/queue.ts); pnpm skips prisma's postinstall build
          # script, so a fresh checkout needs an explicit `prisma generate`
          # for their typechecks to resolve.
          - service: bridge
            prisma: true
          - service: relayer
            prisma: true
          - service: indexer
            prisma: true
          - service: api
            prisma: true
          - service: sdk
            prisma: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - if: matrix.prisma
        run: pnpm --filter "@openlend/${{ matrix.service }}" exec prisma generate
      - run: pnpm --filter "@openlend/${{ matrix.service }}" exec tsc --noEmit
      - run: pnpm --filter "@openlend/${{ matrix.service }}" test
      - name: Audit (non-blocking, workspace-wide)
        # pnpm audit does not support --filter; run it once at the workspace
        # root and treat as advisory. The api package still reports
        # devDep-only findings (testcontainers/vitest chains) that require
        # breaking major upgrades. Tracked in docs/audit-checklist.md.
        # Re-enable as a blocking gate once the dependency upgrades land.
        run: pnpm audit --audit-level=high || true

  # ─── Frontend ───
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # @openlend/dashboard depends on @openlend/sdk via `workspace:*`;
      # the SDK's `main` points at `dist/index.js`, so it must be built
      # before the frontend can resolve/transpile it.
      - run: pnpm --filter "@openlend/sdk" build
      - run: pnpm --filter "@openlend/dashboard" exec tsc --noEmit
      - run: pnpm --filter "@openlend/dashboard" test
      - run: pnpm --filter "@openlend/dashboard" exec next lint
      - name: Build
        run: pnpm --filter "@openlend/dashboard" build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_STELLAR_CONTROLLER: "CABC"
