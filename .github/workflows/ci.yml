name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 20

jobs:
  # ─── Lint all non-code files ───
  lint-configs:
    name: Lint config files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npx prettier --check "**/*.{json,md,yml,yaml}" "!**/node_modules/**" "!**/dist/**" "!**/target/**"

  # ─── Soroban contracts ───
  stellar-contracts:
    name: Soroban contracts
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./stellar-contracts } }
    steps:
      - uses: actions/checkout@v4
      # Pinned to 1.81.0 to avoid zeroize 1.9.0 edition2024 issue.
      # See `stellar-contracts/BUILD_ENV_NOTES.md`. `cargo test
      # --workspace` is still broken due to the rand_core split;
      # we run `cargo check` instead to at least verify compilation.
      - uses: dtolnay/rust-toolchain@1.81.0
        with: { targets: wasm32-unknown-unknown, components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "./stellar-contracts" }
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --target wasm32-unknown-unknown --release
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ─── EVM contracts ───
  evm-contracts:
    name: EVM contracts
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./evm-contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: evm-contracts/package-lock.json }
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test
      - name: Slither static analysis
        uses: crytic/slither-action@v0.4.0
        with:
          contract_dir: evm-contracts/contracts
          solc_version: 0.8.24
          slither_args: --filter-paths "node_modules|openzeppelin" --fail-low

  # ─── TypeScript services ───
  ts-services:
    name: TS services (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [bridge, relayer, indexer, api, sdk]
        include:
          - service: bridge
            prisma: false
            test-env: {}
          - service: relayer
            prisma: false
            test-env: {}
          - service: indexer
            prisma: true
            test-env: {}
          - service: api
            prisma: true
            test-env: {}
          - service: sdk
            prisma: false
            test-env: {}
    defaults: { run: { working-directory: ${{ matrix.service }} } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: "${{ matrix.service }}/package-lock.json" }
      - run: npm ci
      - if: matrix.prisma
        run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
        env: ${{ matrix.test-env }}
      - name: Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ─── Frontend ───
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --passWithNoTests
      - run: npx next lint
      - run: npx next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_STELLAR_CONTROLLER: "CABC"
